[package]
name = "stsms"
version = "0.1.0"
edition = "2024"
default-run = "stsms"

[[bin]]
name = "stsms"
path = "src/main.rs"

[lib]
name = "stsms"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
crossterm = "0.29.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", features = ["json"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
